name: numpy
on: [push]
jobs: 
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with: {python-version: "3.11"}
            - run: pip install -e . && pip install pytest torch pandas tensorboard onnx
            - run: pytests tests/
            - run: docker build -t numpy-ci .