name: gpu
on: [push]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.11'
            - run: pip install -e . && pip install pytest torch torchvision tensorboard onnx
            - run: pytest tests/
            - run: python train_cifar.py
            - run: docker build -t gpu-ci .
            